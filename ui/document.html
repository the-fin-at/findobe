<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemeinsames Dokument · FinDobe</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="document.css"></head><body>
<header class="documentbar"><span id="docName"></span><span id="docStatus" role="status" aria-live="polite">Lade Dokument…</span></header>
<div id="importNotice" role="note" hidden></div>
<nav class="toolbar" aria-label="Dokument formatieren">
<button data-command="undo" title="Rückgängig">↶</button><button data-command="redo" title="Wiederholen">↷</button>
<select id="blockStyle" aria-label="Absatzformat"><option value="p">Absatz</option><option value="h1">Überschrift 1</option><option value="h2">Überschrift 2</option><option value="h3">Überschrift 3</option><option value="h4">Überschrift 4</option></select>
<button data-command="toggleBold">Fett</button><button data-command="toggleUnderline">Unterstrichen</button><button data-command="toggleStrike">Durchgestrichen</button>
<select id="textSize" aria-label="Schriftgröße"><option>11</option><option>9</option><option>14</option><option>18</option><option>24</option><option>32</option></select><input id="textColor" type="color" value="#1b1612" aria-label="Textfarbe">
<button data-command="toggleBulletList">Liste</button><button data-command="toggleOrderedList">Nummerierung</button><button data-command="toggleBlockquote">Zitat</button><button id="insertLink">Link</button><button id="insertImage">Bild</button><button id="insertTable">Tabelle</button>
<select id="tableAction" aria-label="Tabelle bearbeiten"><option value="">Tabellenaktionen</option><option value="addRowAfter">Zeile hinzufügen</option><option value="addColumnAfter">Spalte hinzufügen</option><option value="deleteRow">Zeile löschen</option><option value="deleteColumn">Spalte löschen</option><option value="mergeCells">Zellen verbinden</option><option value="splitCell">Zelle teilen</option><option value="deleteTable">Tabelle löschen</option></select>
<input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
</nav>
<div id="findBox" hidden><input id="findInput" placeholder="Text suchen…" aria-label="Im Dokument suchen"><button id="findClose" aria-label="Suche schließen">×</button></div>
<main class="workspace"><aside class="left"><label for="docTitle">Dokumenttitel</label><input id="docTitle" maxlength="500"><h2>Inhalt</h2><nav id="outline" aria-label="Dokumentinhalt"></nav>
<details><summary>Seitenlayout</summary><label for="pageSize">Format</label><select id="pageSize"><option>A4</option><option value="LETTER">Letter</option></select><label for="orientation">Ausrichtung</label><select id="orientation"><option value="portrait">Hochformat</option><option value="landscape">Querformat</option></select><label for="pageMargin">Rand in Punkten</label><input type="number" id="pageMargin" min="20" max="100" step="0.1"><label for="pageHeader">Kopfzeile</label><input id="pageHeader" maxlength="500"><label for="pageFooter">Fußzeile</label><input id="pageFooter" maxlength="500"><label><input type="checkbox" id="pageNumbers"> Seitenzahlen</label><button id="layoutApply">Layout übernehmen</button></details>
<details open><summary>Exportieren</summary><label for="exportFormat">Dateiformat</label><select id="exportFormat"><option value="pdf">PDF</option><option value="docx">Word · DOCX</option><option value="odt">OpenDocument · ODT</option><option value="html">HTML</option><option value="md">Markdown</option><option value="txt">Text</option><option value="findobe">Findobe-Arbeitsdatei</option></select><button id="doExport">Exportieren…</button><button id="previewPdf">PDF-Vorschau</button></details>
</aside><section class="canvas" aria-label="Dokument"><div id="paper"><div id="paperHeader"></div><div id="editor"></div><div id="paperFooter"></div></div></section>
<aside class="right"><h2>Zusammenarbeit</h2><label for="commentText">Kommentar zur aktuellen Textstelle</label><textarea id="commentText" rows="3" maxlength="10000"></textarea><button id="addComment">Kommentieren</button><div id="collaboration"></div><details><summary>Änderungsverlauf</summary><div id="audit"></div></details></aside></main>
<dialog id="linkDialog"><h2>Link bearbeiten</h2><label for="linkUrl">Linkziel</label><input id="linkUrl" type="text" placeholder="https://…"><div><button id="linkCancel">Abbrechen</button><button id="linkApply">Übernehmen</button></div></dialog>
<script src="document-editor.js"></script><script src="document-controls.js"></script>
</body></html>
