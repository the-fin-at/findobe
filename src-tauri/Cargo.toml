[package]
name = "findobe"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/the-fin-at/findobe"
description = "FinDobe — der visuelle Dokumenteditor von THE-FIN"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
